[project]
name = "lma-rag"
version = "0.1.0"
description = "RAG baseline vs. cross-encoder re-ranking over the MTG Comprehensive Rules"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.1",
    "google-genai>=2.29.0",
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
